name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Rules hold on every supported Hibernate 7 version
        run: tools/test-hibernate-versions.sh

      - name: Reference model passes the checker
        run: python3 skills/hibernate-orm/scripts/check_entities.py --strict src/main

      - name: AGENTS.md is in sync with SKILL.md
        run: python3 tools/build_agents_md.py --check
